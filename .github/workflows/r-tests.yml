name: R tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testthat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install testthat
        run: install.packages("testthat")
        shell: Rscript {0}

      - name: Run unit tests
        run: Rscript tests/run_tests.R
